name: CI

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop

permissions:
  contents: read
  actions: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Static Scan
        id: scan
        run: pnpm run ai:complete
        continue-on-error: true

      - name: Upload scan reports
        if: always() && steps.scan.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: static-scan-reports
          path: AIEF/reports/static-scan/
          retention-days: 30

      - name: Check blocking findings
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::Static scan found blocking findings. Review the scan report artifact for details."
          exit 1

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' && github.base_ref == 'master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Install security tools
        run: |
          # gitleaks
          if ! command -v gitleaks &>/dev/null; then
            curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_amd64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          fi
          # semgrep via pip
          pip3 install semgrep 2>/dev/null || echo "semgrep not available, will be skipped"
        continue-on-error: true

      - name: Security Scan
        id: sec-scan
        run: pnpm run ai:complete:security
        continue-on-error: true

      - name: Upload security scan reports
        if: always() && steps.sec-scan.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: AIEF/reports/static-scan/
          retention-days: 90

      - name: Check security findings
        if: steps.sec-scan.outcome == 'failure'
        run: |
          echo "::error::Security scan found critical/high findings. Review the security scan report artifact."
          exit 1
